# SONARITHM Cargo workspace.
# Layout and dependency rules: docs/architecture/02-repository-and-crate-layout.md
# Lint policy: docs/engineering/coding-standards.md §2

[workspace]
resolver = "3"
members = [
    "crates/sonarithm",
    "crates/sonarithm-core",
    "crates/sonarithm-spec",
    "crates/sonarithm-data",
    "crates/sonarithm-compiler",
    "crates/sonarithm-dsp",
    "crates/sonarithm-render",
    "crates/sonarithm-audio",
    "crates/sonarithm-export",
    "crates/sonarithm-i18n",
    "crates/engines/sonarithm-numisona",
    "crates/engines/sonarithm-audaxis",
    "crates/engines/sonarithm-echometric",
    "apps/cli",
    "bindings/python",
    "xtask",
]
# A02 spikes are standalone throwaway projects with their own lockfiles (roadmap A02).
exclude = ["spikes", "crates/sonarithm-spec/fuzz", "crates/sonarithm-data/fuzz"]

[workspace.package]
# One shared version for every crate until v1.0 (02 §6); release-plz bumps it in the release
# PR (release-plz.toml, one version group).
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/DuhItzAniket/SONARITHM"
license = "MIT OR Apache-2.0"   # ADR-0010
homepage = "https://github.com/DuhItzAniket/SONARITHM"
# Published to crates.io from v0.1.0-alpha: the facade, the crates it depends on and the CLI
# (release-process.md). xtask and the Python crate set `publish = false`.
publish = true
keywords = ["sonification", "accessibility", "audio", "data", "auditory-display"]
categories = ["multimedia::audio", "accessibility", "visualization", "science"]

[workspace.dependencies]
# Internal crates. Use `dep.workspace = true` in member manifests.
sonarithm = { path = "crates/sonarithm", version = "0.0.0" }
sonarithm-core = { path = "crates/sonarithm-core", version = "0.0.0" }
sonarithm-spec = { path = "crates/sonarithm-spec", version = "0.0.0" }
# Without its defaults (file paths, C codecs), so wasm32 crates can depend on it; the app,
# CLI and Python crates enable `fs` and `zstd` (xtask/src/ci.rs, WASM_NO_DEFAULT_FEATURES).
sonarithm-data = { path = "crates/sonarithm-data", version = "0.0.0", default-features = false }
sonarithm-compiler = { path = "crates/sonarithm-compiler", version = "0.0.0" }
sonarithm-dsp = { path = "crates/sonarithm-dsp", version = "0.0.0" }
sonarithm-render = { path = "crates/sonarithm-render", version = "0.0.0" }
sonarithm-audio = { path = "crates/sonarithm-audio", version = "0.0.0" }
sonarithm-export = { path = "crates/sonarithm-export", version = "0.0.0" }
sonarithm-i18n = { path = "crates/sonarithm-i18n", version = "0.0.0" }
sonarithm-numisona = { path = "crates/engines/sonarithm-numisona", version = "0.0.0" }
sonarithm-audaxis = { path = "crates/engines/sonarithm-audaxis", version = "0.0.0" }
sonarithm-echometric = { path = "crates/engines/sonarithm-echometric", version = "0.0.0" }

# Third-party crates. Each addition needs a justification in its PR and must pass
# `cargo deny check` (docs/engineering/supply-chain-and-licensing.md).
anyhow = "1.0.100"          # apps/* and xtask only (coding-standards §4.1)
# CLI argument parsing (11 §2). No `color` feature: help and errors stay plain text for
# screen readers (A11Y), and no terminal-detection dependencies.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
# Raw keyboard input for `sonarithm play` (apps/cli only).
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
# Apache Arrow, the data contract (ADR-0006). The split crates keep the default feature
# set small (no prettyprint, CSV or JSON readers) and wasm32-clean.
arrow-array = "60.0.0"
arrow-data = "60.0.0"
arrow-ipc = { version = "60.0.0", features = ["lz4"] }
arrow-ord = "60.0.0"
arrow-row = "60.0.0"
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
# Arrow from Python through the PyCapsule interface (`__arrow_c_stream__`), maintained with
# arrow-rs; it fixes the PyO3 version below (11 §3).
arrow-pyarrow = "60.0.0"
bytes = "1.12.1"            # Parquet input buffers
cargo_metadata = "0.23.1"   # xtask check-deps
calamine = "0.37.0"         # XLSX, XLSM, XLSB, XLS and ODS (sonarithm-data `xlsx` feature)
chardetng = "1.0.0"         # encoding guess for CSV that is not UTF-8
csv = "1.4.0"
encoding_rs = "0.8.42"
# Civil date-time parsing only: no time-zone database, no system clock.
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
# Audio output (ADR-0004), behind sonarithm-audio's AudioBackend; only that crate may use it.
# `realtime` promotes the device thread (audio_thread_priority, MPL-2.0; no D-Bus).
cpal = { version = "0.18.2", features = ["realtime"] }
# Real-time thread priority for SONARITHM's own device threads (the WASAPI backend), the
# version cpal's `realtime` feature uses.
audio_thread_priority = { version = "0.35", default-features = false }
# The Windows WASAPI backend of ADR-0016 (RAW and exclusive mode); only sonarithm-audio.
wasapi = "0.26.0"
# The performance counter for latency measurement (the clock WASAPI timestamps use); the
# version cpal and wasapi already use.
windows = { version = "0.62.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Performance"] }
# EBU R128 / ITU-R BS.1770 loudness and true-peak metering (SDR-24 meter, golden ΔLUFS).
ebur128 = "0.1.10"
# Export writers (06 §7): WAV and pure-Rust FLAC. flacenc without its default features: no
# worker threads (`par`), logging or serde.
flacenc = { version = "0.5.1", default-features = false }
hound = "3.5.1"
# Message catalogues (12 §5): Fluent messages shared with the UI (sonarithm-i18n only). The
# memoizer and language identifiers are the versions fluent-bundle uses.
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"     # sonarithm-i18n tests: walk the catalogue AST
intl-memoizer = "0.5.3"
unic-langid = "0.9.6"
# Locale formatting of numbers and dates (12 §5) with ICU4X's compiled data; no serde or
# data-provider features (sonarithm-i18n only).
fixed_decimal = { version = "0.7.2", default-features = false, features = ["ryu"] }
icu_calendar = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.3.0", default-features = false, features = ["compiled_data", "alloc"] }
icu_locale_core = { version = "2.3.0", default-features = false }
# `sync` makes ICU4X data payloads Send + Sync, so a localizer can be shared between threads.
icu_provider = { version = "2.3.0", default-features = false, features = ["sync"] }
# Pure-Rust maths for every Score-affecting transcendental function (ADR-0013). The default
# `arch` feature only swaps in IEEE-exact instructions (sqrt, rounding), so results stay
# identical on every platform.
libm = "0.2.16"
# Diagnostic reports for spec errors (12 §1); no `fancy` features in libraries.
miette = { version = "7.6.0", default-features = false }
# Sandboxed transform expressions (03 §6): no default features, so no runtime RNG (wasm32)
# and no time package; user functions, modules, closures and custom syntax are compiled out.
rhai = { version = "1.26.1", default-features = false, features = ["std", "no_time", "no_function", "no_module", "no_closure", "no_custom_syntax"] }
# Parquet through Arrow, without the async (tokio) default. Pure-Rust codecs only; zstd is
# a sonarithm-data feature because it builds C code.
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap", "brotli", "flate2-zlib-rs", "lz4", "simdutf8"] }
# Real-time communication (06 §4): wait-free SPSC rings, latest-value telemetry and
# deferred frees off the audio thread. triple_buffer is MPL-2.0 (allowed, unmodified).
basedrop = "0.1.3"
rtrb = "0.4.0"
triple_buffer = "9.0.0"
# Python bindings (11 §3): abi3 wheels for CPython 3.10 and later. 0.29, not 0.30, because
# arrow-pyarrow 60 is built on it.
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
# Seeded, portable random streams per track (SDR-02, coding-standards §10).
rand_chacha = { version = "0.10.0", default-features = false }
# JSON Schema generation for the spec (04 §1); `derive` only, no optional integrations.
schemars = { version = "1.0.4", default-features = false, features = ["derive", "std"] }
# Shortest round-trip float digits with ties to even, for RFC 8785 numbers (F-020).
ryu = "1.0.20"
serde = { version = "1.0.228", features = ["derive"] }
serde_path_to_error = "0.1.20"   # JSON pointers for spec shape errors (04 §8 layer 2)
# `float_roundtrip`: the default parser can be 1 ULP off, which breaks full-precision Score
# and spec round trips (ADR-0013).
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
sha2 = { version = "0.11.0", default-features = false }  # spec hash, Score hash, fingerprints (ADR-0013)
thiserror = "2.0.17"
# TOML for engine data tables (NUMISONA's concepts.toml, 03 §3.3); parsing only, no writer.
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "serde"] }

# Counts allocations per thread; replaces the global allocator wherever it is linked, so it
# is only a dev-dependency or behind the `count-allocations` feature (A05-T10; used instead of
# assert_no_alloc, whose BSD-1-Clause licence deny.toml does not allow, F-038).
allocation-counter = "0.8.1"
# Test-only crates (dev-dependencies).
# Benchmarks (testing-strategy §9.1); no plotting or rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
boon = "0.6.1"              # JSON Schema (draft 2020-12) validator for the render manifest test
claxon = "0.4.3"            # an independent FLAC decoder, to validate flacenc output
# Runs the `sonarithm` binary in CLI tests (testing-strategy §4).
assert_cmd = "2.2.2"
insta = "1.43.0"
# Builds XLSX and ODS packages in sonarithm-data tests; the version calamine already uses.
zip = { version = "9.0.5", default-features = false }
# Without the default `fork` and `timeout` features, which pull in rusty-fork and tempfile.
# `test-support` features make proptest an optional normal dependency of library crates,
# and cargo metadata unifies dev-dependency features, so check-deps would see
# core -> proptest -> tempfile when another crate enables core/test-support (#121).
proptest = { version = "1.9.0", default-features = false, features = ["std", "bit-set"] }
shuttle = "0.9.7"           # randomized concurrency testing of the RT protocol (testing-strategy §8)

# Debug info is most of a `target/` directory's size (PDB files on Windows), and every
# worktree keeps its own `target/`. Line tables keep file:line backtraces for our crates;
# dependencies get none. To step through code in a debugger, override locally:
# `CARGO_PROFILE_DEV_DEBUG=full` (dev-environment.md, "Disk usage").
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "deny"                  # backstop; crates on the unsafe register opt in locally (section 5)
unsafe_op_in_unsafe_fn = "deny"       # warn-by-default in edition 2024; we deny
unreachable_pub = "warn"              # keep the public surface intentional

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noisy pedantic lints are allowed here one by one, each with a comment giving the reason.
# The initial allow list is set in A01 and reviewed at every phase review.
# A01: none needed yet.

# Restriction lints we opt into
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"   # every `unsafe {}` needs a `// SAFETY:` comment
allow_attributes_without_reason = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
