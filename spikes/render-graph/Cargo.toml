# A02-T02/T03/T04 spike: owned render graph vs Firewheel behind a draft `RenderGraph` trait,
# plus the offline determinism check (throwaway, see README.md).
# Standalone: excluded from the root workspace (`exclude = ["spikes"]`).
[package]
name = "spike-render-graph"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
assert_no_alloc = "=1.1.2"   # BSD-1-Clause: not yet in deny.toml's allow list (finding)
audioadapter-buffers = "=5.2.0" # the buffer adapters Firewheel's processor takes
cpal = "=0.18.2"
ebur128 = "=0.1.10"
# A02-T03: no cpal backend (the bench drives the processor), with sample-accurate scheduling.
firewheel = { version = "=0.14.0", default-features = false, features = ["std", "scheduled_events"] }
hound = "=3.5.1"
libm = "=0.2.16"
sha2 = "=0.11.1"

[lints.rust]
# `--cfg spike_miri_system_alloc` drops the assert_no_alloc allocator (Miri runs, see main.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(spike_miri_system_alloc)"] }

[profile.release]
debug = "line-tables-only"

[workspace]
