# A02-T05..T07 spike host (throwaway, see ../README.md). Standalone: excluded from the root
# workspace (`exclude = ["spikes"]`).
[package]
name = "spike-tauri-webview"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[workspace]
