[package]
name = "sonarithm-cli"
description = "The `sonarithm` command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "multimedia::audio", "accessibility"]
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "sonarithm"
path = "src/main.rs"
# The facade crate `sonarithm` owns target/doc/sonarithm; documenting this binary too
# would collide with it.
doc = false

[dependencies]
clap.workspace = true
# Diagnostic reports: the graphical handler on terminals, the narratable one for `--plain`
# and pipes (11 §2). `fancy-no-syscall` adds the graphical handler without terminal probing.
miette = { workspace = true, features = ["fancy-no-syscall"] }
serde.workspace = true
serde_json.workspace = true
sonarithm.workspace = true
# The study runner (A08-T03): the library decides and logs; this crate plays and asks.
sonarithm-audio.workspace = true
sonarithm-echometric.workspace = true
sonarithm-render.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta = { workspace = true, features = ["filters"] }

[lints]
workspace = true
