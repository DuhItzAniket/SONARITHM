# Long-running checks (docs/engineering/ci-cd.md#workflow-inventory). Fuzzing (testing-strategy
# §7), 30 minutes per target each night: the spec parser and migrations (from A03) and the
# data-layer importers (from A04: CSV/TSV, JSON/NDJSON, XLSX/ODS, Parquet/Arrow IPC), the
# `.sonarithm` project reader (from B05) and the stream payload decoders (from B06: JSON,
# OSC, lines), the chart parsers (from C01) and the function expressions (from C03). The
# targets are the `[[bin]]` entries of every `crates/**/fuzz/Cargo.toml`, so a new one is
# fuzzed without editing this file.
# Manual dispatch takes the seconds per target; use 3600 for an exit run. A pull request
# runs a two-minute smoke fuzz of each target in a crate it changes (the `plan` job,
# .github/scripts/ci_scope.py), and of every target when it changes this workflow or that
# script. From A05: the 10-minute allocation soak on the null device; from B06: the
# 10-minute stream soak (PB-11) (testing-strategy §9.3). Not a required check.
name: nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (at most 4800)
        required: false
        default: "1800"
  pull_request:
    paths:
      - "crates/sonarithm-core/**"
      - "crates/sonarithm-spec/**"
      - "crates/sonarithm-data/**"
      - "crates/sonarithm-stream/**"
      - "crates/sonarithm-app/**"
      - "crates/engines/sonarithm-plotsona/**"
      - "crates/engines/sonarithm-curvasona/**"
      - ".github/workflows/nightly.yml"
      - ".github/scripts/ci_scope.py"

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The fuzz targets to run: all of them off pull requests, and on a pull request those of
  # the crates it changes (`git diff --name-only` of the merge commit against the base).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      fuzz: ${{ steps.scope.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: python3 -m unittest discover --start-directory .github/scripts --verbose
      # `shell: bash` adds pipefail, so a failing script fails the step despite `tee`.
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 .github/scripts/ci_scope.py changes --event "$EVENT" < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.fuzz != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.fuzz) }}
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '120' || inputs.seconds || '1800' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the duration input
        run: |
          if ! [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] || [ "$FUZZ_SECONDS" -gt 4800 ]; then
            echo "::error::seconds must be a whole number of at most 4800"
            exit 1
          fi
      - run: rustup toolchain install nightly --profile minimal
      # The app core links the audio crate, whose ALSA backend needs the headers.
      - if: matrix.crate == 'sonarithm-app'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz ${{ matrix.target }}
        working-directory: crates/${{ matrix.crate }}
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time="$FUZZ_SECONDS"
          -rss_limit_mb=2048
          -timeout=10
          -print_final_stats=1
      # A crash leaves its input under fuzz/artifacts; minimize it and commit it as a
      # regression test in the owning crate (testing-strategy §7).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore

  # No allocation on the audio thread over 10 minutes of the benchmark Score on the
  # timer-driven null device, in a debug build (A05-T10, coding-standards §11.5). The
  # `no-alloc` job in ci.yml runs the same soak for 60 s on every PR; here a PR that edits
  # this workflow runs 60 s too.
  alloc-soak:
    name: alloc-soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      SOAK_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alloc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - shell: bash
        run: cargo run --locked -p sonarithm-audio --features count-allocations --example soak -- --backend null --seconds "$SOAK_SECONDS" --strict

  # PB-11 (B06-T07, testing-strategy §9.3): a 1 kHz synthetic stream played live through
  # the app core for 10 minutes on the timer-driven null device. Memory stays bounded, no
  # rows are lost and playback keeps up with the data; underruns are reported, not gated
  # (the xrun check runs on reference hardware before releases). A PR that edits this
  # workflow or the app core runs 60 s, too short to judge memory.
  stream-soak:
    name: stream-soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      SOAK_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
      SONARITHM_BACKEND: "null"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - shell: bash
        run: cargo run --locked --release -p sonarithm-app --example stream_soak -- --seconds "$SOAK_SECONDS" --strict --report stream-soak.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-soak-${{ matrix.os }}
          path: stream-soak.jsonl
          if-no-files-found: ignore
