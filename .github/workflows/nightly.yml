# Long-running checks (docs/engineering/ci-cd.md#workflow-inventory). Fuzzing (testing-strategy
# §7), 30 minutes per target each night: the spec parser and migrations (from A03) and the
# data-layer importers (from A04: CSV/TSV, JSON/NDJSON, XLSX/ODS, Parquet/Arrow IPC), the
# `.sonarithm` project reader (from B05) and the stream payload decoders (from B06: JSON,
# OSC, lines) and the chart parsers (from C01).
# Manual dispatch takes the seconds per target; use 3600 for an exit run. Pull requests that
# touch a fuzzed crate run a two-minute smoke fuzz of every target. From A05: the 10-minute
# allocation soak on the null device; from B06: the 10-minute stream soak (PB-11)
# (testing-strategy §9.3). Not a required check.
name: nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (at most 4800)
        required: false
        default: "1800"
  pull_request:
    paths:
      - "crates/sonarithm-core/**"
      - "crates/sonarithm-spec/**"
      - "crates/sonarithm-data/**"
      - "crates/sonarithm-stream/**"
      - "crates/sonarithm-app/**"
      - "crates/engines/sonarithm-plotsona/**"
      - ".github/workflows/nightly.yml"

permissions: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: sonarithm-spec, target: spec_parse }
          - { crate: sonarithm-spec, target: spec_migrate }
          - { crate: sonarithm-data, target: csv_read }
          - { crate: sonarithm-data, target: json_read }
          - { crate: sonarithm-data, target: xlsx_read }
          - { crate: sonarithm-data, target: columnar_read }
          - { crate: sonarithm-stream, target: stream_json }
          - { crate: sonarithm-stream, target: stream_osc }
          - { crate: sonarithm-stream, target: stream_line }
          - { crate: sonarithm-app, target: project_open }
          - { crate: engines/sonarithm-plotsona, target: chart_extract }
          - { crate: engines/sonarithm-plotsona, target: office_chart }
          - { crate: engines/sonarithm-plotsona, target: chart_json }
          - { crate: engines/sonarithm-plotsona, target: html_page }
          - { crate: engines/sonarithm-plotsona, target: svg_chart }
          - { crate: engines/sonarithm-plotsona, target: pdf_chart }
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '120' || inputs.seconds || '1800' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the duration input
        run: |
          if ! [[ "$FUZZ_SECONDS" =~ ^[0-9]+$ ]] || [ "$FUZZ_SECONDS" -gt 4800 ]; then
            echo "::error::seconds must be a whole number of at most 4800"
            exit 1
          fi
      - run: rustup toolchain install nightly --profile minimal
      # The app core links the audio crate, whose ALSA backend needs the headers.
      - if: matrix.crate == 'sonarithm-app'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install --locked cargo-fuzz@0.13.2
      - name: Fuzz ${{ matrix.target }}
        working-directory: crates/${{ matrix.crate }}
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time="$FUZZ_SECONDS"
          -rss_limit_mb=2048
          -timeout=10
          -print_final_stats=1
      # A crash leaves its input under fuzz/artifacts; minimize it and commit it as a
      # regression test in the owning crate (testing-strategy §7).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore

  # No allocation on the audio thread over 10 minutes of the benchmark Score on the
  # timer-driven null device, in a debug build (A05-T10, coding-standards §11.5). The
  # `no-alloc` job in ci.yml runs the same soak for 60 s on every PR; here a PR that edits
  # this workflow runs 60 s too.
  alloc-soak:
    name: alloc-soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      SOAK_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - shell: bash
        run: cargo run --locked -p sonarithm-audio --features count-allocations --example soak -- --backend null --seconds "$SOAK_SECONDS" --strict

  # PB-11 (B06-T07, testing-strategy §9.3): a 1 kHz synthetic stream played live through
  # the app core for 10 minutes on the timer-driven null device. Memory stays bounded, no
  # rows are lost and playback keeps up with the data; underruns are reported, not gated
  # (the xrun check runs on reference hardware before releases). A PR that edits this
  # workflow or the app core runs 60 s, too short to judge memory.
  stream-soak:
    name: stream-soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      SOAK_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '600' }}
      SONARITHM_BACKEND: "null"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - shell: bash
        run: cargo run --locked --release -p sonarithm-app --example stream_soak -- --seconds "$SOAK_SECONDS" --strict --report stream-soak.jsonl
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stream-soak-${{ matrix.os }}
          path: stream-soak.jsonl
          if-no-files-found: ignore
