# CLI binaries for GitHub Releases (docs/engineering/release-process.md, "What is released";
# supply-chain-and-licensing.md, "SBOM, auditable binaries and provenance").
#
# For each platform: `cargo auditable` builds `sonarithm` (the dependency tree is embedded,
# so cargo-audit, Trivy or osv-scanner can audit the binary), cargo-cyclonedx writes the
# SBOM, cargo-about writes the third-party notices, and the archive bundles them with the
# licences. On a release tag the archives are attested (SLSA build provenance, verify with
# `gh attestation verify`) and uploaded to the GitHub release that release-plz created.
# Pull requests that change this workflow or the notices configuration build everything
# without attesting or uploading: the dry run.
name: release-binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release-binaries.yml"
      - "about.toml"
      - "about.hbs"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { runner: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # cpal (sonarithm-audio) links ALSA on Linux. ubuntu-22.04 keeps the glibc floor low.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable,cargo-cyclonedx,cargo-about
      - name: Build, SBOM and notices
        shell: bash
        run: |
          cargo auditable build --release --locked -p sonarithm-cli --target "${{ matrix.target }}"
          cargo cyclonedx --manifest-path apps/cli/Cargo.toml --format json --target "${{ matrix.target }}" --override-filename sonarithm-cli.cdx
          cargo about generate --manifest-path apps/cli/Cargo.toml --fail about.hbs --output-file THIRD-PARTY-NOTICES.html
      - name: Archive
        id: archive
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='sonarithm-cli'))")
          name="sonarithm-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=sonarithm; [ "$RUNNER_OS" = "Windows" ] && exe=sonarithm.exe
          cp "target/${{ matrix.target }}/release/$exe" "dist/$name/"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.html apps/cli/sonarithm-cli.cdx.json "dist/$name/"
          cp apps/cli/README.md "dist/$name/README.md"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z a -bd "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          echo "file=dist/$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: ${{ steps.archive.outputs.file }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'DuhItzAniket/SONARITHM'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # release-plz creates the release with the tag; wait for it, then attach the archives.
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
              gh release upload "$TAG" dist/* --repo "$REPO" --clobber
              exit 0
            fi
            sleep 30
          done
          echo "No GitHub release for $TAG after 3 minutes" >&2
          exit 1
