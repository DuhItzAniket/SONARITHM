# Rust checks on Linux, Windows and macOS (docs/engineering/ci-cd.md).
# The required status check is `ci / all-checks-pass`, which aggregates every job, so
# jobs can be added without editing the branch ruleset. Job names are part of that contract.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain pinned in rust-toolchain.toml with its components and targets.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cpal (sonarithm-audio) links ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      # nextest does not run doctests.
      - run: cargo test --workspace --doc --locked

  doc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cpal (sonarithm-audio) links ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - run: cargo doc --workspace --no-deps --locked

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Installed as a checksum-verified binary and run with the pinned toolchain, the
      # same way as `cargo xtask ci` runs it locally.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  check-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask check-deps
      # CITATION.cff and .zenodo.json must name the workspace version (release-process.md).
      - run: cargo xtask citation --check

  msrv:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cpal (sonarithm-audio) links ALSA on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      # Checks each crate with the toolchain of its own `rust-version` (1.88 for core
      # crates; higher for leaf crates that declare it).
      - run: cargo hack check --rust-version --workspace --all-targets --locked

  wasm32:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # xtask links the app core for its code tables, and cpal (sonarithm-audio) links ALSA.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      # The crate list lives in xtask/src/ci.rs (WASM_CRATES).
      - run: cargo xtask wasm-check

  # Golden audio (testing-strategy §5, A05-T11): each OS checks every case against its
  # manifest and at other block sizes, then uploads its renders for the cross-OS comparison.
  golden:
    name: golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run --release --locked -p xtask -- golden
      - run: cargo run --release --locked -p xtask -- golden --render-set renders/${{ matrix.os }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-${{ matrix.os }}
          path: renders/${{ matrix.os }}
          retention-days: 14

  # PB-06: the Windows and macOS renders against the Linux renders (null residual ≤ −90 dBFS,
  # ΔLUFS ≤ 0.1).
  golden-compare:
    needs: golden
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: renders
      # `shell: bash` adds pipefail, so a failed comparison fails the job despite `tee`.
      - shell: bash
        run: |
          cargo run --release --locked -p xtask -- golden --compare renders/golden-ubuntu-latest renders/golden-windows-latest renders/golden-macos-latest | tee -a "$GITHUB_STEP_SUMMARY"

  # No allocation on the audio thread (coding-standards §11.5, A05-T10), in debug builds:
  # the scripted render session, the whole callback on the null device, then a 60 s soak on
  # the timer-driven null device. The 10-minute soak is the alloc-soak job of nightly.yml.
  no-alloc:
    name: no-alloc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - run: cargo test --locked -p sonarithm-render --test no_alloc
      - run: cargo test --locked -p sonarithm-audio --features count-allocations --test no_alloc_device
      - run: cargo run --locked -p sonarithm-audio --features count-allocations --example soak -- --backend null --seconds 60 --strict

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Active LTS line, inside the `engines` range of package.json.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      # Package tests with node:test, including the Rust–TypeScript message contract and the
      # pseudo-locale check of @sonarithm/i18n (B02-T08).
      - run: pnpm -r test

  # The examples gallery (examples/README.md): its datasets regenerate byte for byte from
  # their seeded generators, and every spec renders with the CLI. The renders are uploaded
  # so they can be listened to.
  gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cpal (sonarithm-audio) links ALSA on Linux.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - run: cargo xtask gallery --check
      - name: Render every gallery spec
        run: |
          mkdir -p target/gallery
          for spec in examples/specs/*.spec.json; do
            name=$(basename "$spec" .spec.json)
            cargo run --locked --quiet -p sonarithm-cli -- --plain render "$spec" -o "target/gallery/$name.flac"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-renders
          path: target/gallery
          retention-days: 14
          if-no-files-found: error

  all-checks-pass:
    if: always()
    needs: [fmt, clippy-test, doc, deny, check-deps, msrv, wasm32, golden, golden-compare, no-alloc, frontend, gallery]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
