# The PR title becomes the squash commit, so it must be a Conventional Commits header
# with an allowed type and scope (docs/engineering/git-workflow.md#commit-messages).
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types and scopes from git-workflow.md; `spike` is for throwaway A02 prototypes.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            spike
          scopes: |
            core
            facade
            spec
            schemas
            data
            compiler
            dsp
            render
            audio
            speech
            export
            stream
            app
            desktop
            ui
            viz
            ipc
            cli
            python
            wasm
            plugins
            xtask
            ci
            release
            deps
            docs
            adr
            rfc
            research
            design
            a11y
            numisona
            audaxis
            sonotrace
            plotsona
            curvasona
            axonote
            echometric
            tonalens
            resonum
          requireScope: false
          # Description: lower case first letter, no full stop at the end.
          subjectPattern: ^(?![A-Z]).*[^.]$
          subjectPatternError: |
            The description "{subject}" must start with a lower-case letter and must not end
            with a full stop (docs/engineering/git-workflow.md).
      - name: Header is at most 72 characters
        env:
          # Untrusted input reaches the script only through the environment.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          length=${#TITLE}
          if [ "$length" -gt 72 ]; then
            echo "::error::The PR title has $length characters; the limit is 72."
            exit 1
          fi
