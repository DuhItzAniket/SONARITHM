# pnpm workspace for the frontend (docs/architecture/02-repository-and-crate-layout.md §1).
packages:
  - "apps/desktop"
  - "packages/*"

# One version of each tool for the whole workspace; packages refer to it as "catalog:".
catalog:
  # Fluent messages in the UI (@sonarithm/i18n); the Rust side is fluent-bundle (12 §5).
  "@fluent/bundle": ^0.19.1
  # The desktop shell (B01-T03): the versions the A02 prototype ran (ADR-0002, ADR-0003).
  # The Tauri packages match the `tauri` crate's minor version.
  "@tauri-apps/api": 2.12.4
  "@tauri-apps/cli": 2.12.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  react: 19.3.1
  react-aria-components: 1.22.1
  # React Aria's hooks, at the versions react-aria-components 1.22.1 uses, for widgets it
  # cannot express (a slider with SONARITHM's units, B02-T05).
  react-aria: 3.53.1
  react-stately: 3.51.0
  react-dom: 19.3.1
  vite: 8.3.4
  # Frontend test infrastructure (B02-T03; testing-strategy §12, §13.1). Storybook 10 with
  # its accessibility (axe-core) and Vitest addons; Vitest 4 browser mode on Playwright's
  # Chromium; Playwright for cross-engine E2E with axe. The CI container image tag
  # (mcr.microsoft.com/playwright) must match the playwright version.
  "@axe-core/playwright": 4.14.0
  "@playwright/test": 1.64.1
  "@storybook/addon-a11y": 10.6.5
  "@storybook/addon-vitest": 10.6.5
  "@storybook/react-vite": 10.6.5
  "@vitest/browser": 4.1.12
  "@vitest/browser-playwright": 4.1.12
  axe-core: 4.14.0
  playwright: 1.64.1
  storybook: 10.6.5
  vitest: 4.1.12
  vitest-browser-react: 2.3.0
  # Node types for package tests run with `node --test` (Node 24, the CI line).
  "@types/node": ^26.6.5
  # ESLint stays on 9.x until eslint-plugin-jsx-a11y supports ESLint 10 (its peer range ends at ^9).
  "@eslint/js": ^9.39.5
  eslint: ^9.39.5
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  prettier: ^3.9.10
  # CSS lint: no hard-coded colours, spacing or durations, and the design-language
  # anti-patterns (coding-standards §12.6; B02-T01).
  stylelint: ^17.16.0
  # TypeScript stays on 6.0.x while typescript-eslint supports only TypeScript < 6.1.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.2

# Dependency install scripts, reviewed one by one (pnpm 12 fails the install on an unreviewed
# one, F-133). esbuild (Storybook) gets its binary from an optional per-platform package;
# its script only re-checks that binary, so it stays off.
allowBuilds:
  esbuild: false
