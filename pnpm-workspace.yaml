# pnpm workspace for the frontend (docs/architecture/02-repository-and-crate-layout.md §1).
# apps/desktop joins in B01.
packages:
  - "packages/*"

# One version of each tool for the whole workspace; packages refer to it as "catalog:".
catalog:
  # ESLint stays on 9.x until eslint-plugin-jsx-a11y supports ESLint 10 (its peer range ends at ^9).
  "@eslint/js": ^9.39.5
  eslint: ^9.39.5
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  prettier: ^3.9.10
  # TypeScript stays on 6.0.x while typescript-eslint supports only TypeScript < 6.1.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.2
