[package]
name = "sonarithm"
description = "The SONARITHM facade: the stable public API for compiling and rendering sonifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
# File reading, spreadsheets and Zstandard-compressed columnar files, as in the data layer.
# wasm32 builds use `--no-default-features` (xtask WASM_NO_DEFAULT_FEATURES, 02 §2).
default = ["fs", "xlsx", "zstd"]
# Read specs and data files from paths.
fs = ["sonarithm-data/fs"]
# XLSX and ODS sources (calamine).
xlsx = ["sonarithm-data/xlsx"]
# Zstandard-compressed Parquet and Arrow IPC; builds C code.
zstd = ["sonarithm-data/zstd"]
# Everything non-copyleft (02 §4).
full = ["fs", "xlsx", "zstd"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sonarithm-audaxis.workspace = true
sonarithm-compiler.workspace = true
sonarithm-core.workspace = true
sonarithm-data.workspace = true
sonarithm-dsp.workspace = true
sonarithm-export.workspace = true
sonarithm-numisona.workspace = true
sonarithm-render.workspace = true
sonarithm-spec.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
sha2.workspace = true

[lints]
workspace = true
