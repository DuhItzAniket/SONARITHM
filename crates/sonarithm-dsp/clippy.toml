# Clippy configuration for a crate on the render path. Clippy uses the nearest clippy.toml
# and does not merge it with the root one, so the first block repeats the workspace
# settings (/clippy.toml). Keep the copies in sync.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
doc-valid-idents = ["PolyBLEP", ".."]

# The std float functions call the platform maths library, whose results differ in the last
# bits between platforms. Renders are bit-identical across OSes only when the render path
# avoids them (F-039, ADR-0013). Per sample, use the polynomial in `osc::sine_turns`;
# at set-up time, use libm or sonarithm_core::math.
disallowed-methods = [
    { path = "f32::sin", reason = "platform-dependent (F-039); use osc::sine_turns or libm::sinf" },
    { path = "f32::cos", reason = "platform-dependent (F-039); use osc::sine_turns or libm::cosf" },
    { path = "f32::tan", reason = "platform-dependent (F-039); use libm::tanf" },
    { path = "f32::exp", reason = "platform-dependent (F-039); use libm::expf" },
    { path = "f32::exp2", reason = "platform-dependent (F-039); use libm::exp2f" },
    { path = "f32::ln", reason = "platform-dependent (F-039); use libm::logf" },
    { path = "f32::log10", reason = "platform-dependent (F-039); use libm::log10f" },
    { path = "f32::log2", reason = "platform-dependent (F-039); use libm::log2f" },
    { path = "f32::powf", reason = "platform-dependent (F-039); use libm::powf" },
    { path = "f32::powi", reason = "platform-dependent (F-039); use libm::powf or multiply" },
    { path = "f64::sin", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::sin" },
    { path = "f64::cos", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::cos" },
    { path = "f64::tan", reason = "platform-dependent (ADR-0013); use libm::tan" },
    { path = "f64::exp", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::exp" },
    { path = "f64::exp2", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::exp2" },
    { path = "f64::ln", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::ln" },
    { path = "f64::log10", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::log10" },
    { path = "f64::log2", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::log2" },
    { path = "f64::powf", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::pow" },
    { path = "f64::powi", reason = "platform-dependent (ADR-0013); use sonarithm_core::math::pow" },
]
