sonarithm-data = { workspace = true, features = ["fs"] }
sonarithm-render.workspace = true
sonarithm-spec.workspace = true
thiserror.workspace = true
ts-rs.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
