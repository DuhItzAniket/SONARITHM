[package]
name = "sonarithm-app"
description = "SONARITHM headless app core: sessions, the IPC protocol, transport, jobs and settings for the desktop app and the CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Not published until the desktop app's first release (B03-T14); the CLI keeps its own
# path to the facade until then.
publish = false

[dependencies]
arrow-array.workspace = true
schemars.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
sonarithm.workspace = true
sonarithm-audaxis.workspace = true
sonarithm-audio.workspace = true
sonarithm-core.workspace = true
sonarithm-data = { workspace = true, features = ["fs"] }
sonarithm-i18n.workspace = true
sonarithm-render.workspace = true
sonarithm-numisona.workspace = true
sonarithm-sonotrace.workspace = true
sonarithm-spec.workspace = true
sonarithm-speech.workspace = true
sonarithm-stream.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
# Project bundles (RFC-0002): deflate through flate2 with the pure-Rust zlib-rs backend.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
# Counts allocations in the project-memory test only (RFC-0002 §6, condition B).
allocation-counter.workspace = true
proptest.workspace = true
# The cue sidecar of a narrated Score in the speech tests (B03-T07).
sonarithm-export.workspace = true
# Chart files with remote data and HTML pages, read under the network-deny harness
# (C01-T06); the app core opens charts itself from C01-T12.
sonarithm-plotsona.workspace = true

[lints]
workspace = true
