[package]
name = "sonarithm-plotsona"
description = "PLOTSONA: SONARITHM's chart ingestion engine (exact-first extraction from Office charts, chart JSON, SVG and vector PDF; chart templates)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
# An Office chart's workbook (C01-T05); the version sonarithm-data uses.
calamine.workspace = true
# `FlateDecode` PDF streams (C01-T02, C01-T08); the pure-Rust backend already in the tree.
flate2.workspace = true
libm.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sonarithm-core.workspace = true
sonarithm-data.workspace = true
sonarithm-spec.workspace = true
svgtypes.workspace = true
# Office containers (XLSX, PPTX, DOCX): Deflate only, pure Rust (C01-T02).
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest.workspace = true

[lints]
workspace = true
