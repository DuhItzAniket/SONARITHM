[package]
name = "sonarithm-audaxis"
description = "AUDAXIS: SONARITHM's navigation and context engine (navigation tree, cursor, announcements, context tracks, earcons, spatial placement)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
serde.workspace = true
serde_json.workspace = true
sonarithm-core.workspace = true
sonarithm-data.workspace = true
sonarithm-spec.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
proptest.workspace = true
sonarithm-compiler.workspace = true
# Tests compile real templates through NUMISONA. A dev-dependency only: engines never
# depend on each other in shipped code (02 §3 rule 2), and check-deps skips dev-dependencies.
sonarithm-numisona.workspace = true
# Offline renders for the mono-survival test (A11Y-14); never plays audio.
sonarithm-render.workspace = true

[lints]
workspace = true
