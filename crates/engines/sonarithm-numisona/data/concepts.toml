#
# NUMISONA concept table (docs/architecture/03-data-model.md §3.3).
#
# A concept names what a field measures in perceptual terms. For a pitch channel with
# `"polarity": "auto"`, the field's concept picks the default direction (SDR-12..14), and
# its `exponent` is the magnitude-estimation exponent m offered as guidance for the
# psychophysical scale (SDR-11). The table is data, not code: every row cites its evidence
# (`evidence`, `rules`, and `votes` where a study counted listeners). Change a row only
# through the design-rules change control (docs/research/design-rules.md, rule 1): state
# the old and the new value and link a finding or experiment.
#
# Fields:
#   name      concept name: dot-separated lowercase words (03 §3.3)
#   polarity  positive | negative | avoid (no consistent direction; avoid pitch) |
#             unknown (no study yet; SDR-41)
#   flagged   listeners disagree or no study exists: a warning names the evidence
#   exponent  magnitude-estimation exponent m (absolute value of the majority slope), guidance
#   votes     listeners with a positive, no, or negative polarity
#   rules     design rules the row implements
#   evidence  the source, as cited in docs/research/notes/02-theory-perception.md §2b
#
# Walker 2007 counts are from Exp. 1, frequency (pitch) set, n = 19 per block, read from its
# Table 1 (Walker 2007, Applied Cognitive Psychology 21(5):579-599, doi:10.1002/acp.1291).

schema = 1

[[concept]]
name = "generic"
polarity = "positive"
flagged = false
rules = ["SDR-12"]
evidence = "SDR-12 default for generic quantities (Walker 2002, doi:10.1037/1076-898X.8.4.211, and Walker 2007): perceptual pitch judgments showed no negative polarities, and listeners use a 'higher means more' model for abstract magnitudes."

