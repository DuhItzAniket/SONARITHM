[package]
name = "sonarithm-echometric-reference"
description = "Test-only: ECHOMETRIC's detectors checked against statrs and augurs (ADR-0031). Never published, never in a compile."
version.workspace = true
edition.workspace = true
# statrs 0.19 needs Rust 1.89. This crate alone declares it, so ECHOMETRIC stays at the core
# MSRV (1.88) and the CI `msrv` job checks this crate at its own version (ADR-0031).
rust-version = "1.89"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
proptest.workspace = true
sonarithm-echometric.workspace = true
# augurs-changepoint's results are pinned in tests/fixtures (ADR-0031's fallback): its
# dependencies (argmin through rv) carry unmaintained-crate advisories that `cargo deny`
# refuses, and the advisory policy is not this crate's to change.
augurs-seasons = "0.10.3"
serde_json.workspace = true
statrs = { version = "0.19.1", default-features = false }

[lints]
workspace = true
