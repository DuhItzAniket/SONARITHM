[package]
name = "sonarithm-data"
description = "Arrow-backed DataBundle, file sources, inference, transforms and downsampling for SONARITHM."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fs", "zstd"]
# Read sources from file paths. Off for wasm32-unknown-unknown (02 §2: "Partial (no fs)").
fs = []
# Zstandard-compressed Parquet and Arrow IPC (the Polars default). Builds the C library.
zstd = ["parquet/zstd", "arrow-ipc/zstd"]

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
bytes.workspace = true
chardetng.workspace = true
csv.workspace = true
encoding_rs.workspace = true
jiff.workspace = true
parquet.workspace = true
serde_json.workspace = true
serde.workspace = true
sonarithm-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
