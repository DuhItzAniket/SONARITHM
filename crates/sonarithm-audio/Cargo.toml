[package]
name = "sonarithm-audio"
description = "SONARITHM audio backends: AudioBackend trait, cpal backend, devices and latency reporting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Counts allocations and frees in every audio callback (debug soak and the CI no-alloc job,
# coding-standards §11.5). It installs a counting global allocator: never in release builds
# of applications.
count-allocations = ["dep:allocation-counter"]

[dependencies]
allocation-counter = { workspace = true, optional = true }
cpal.workspace = true
rtrb.workspace = true
sonarithm-core.workspace = true
sonarithm-render.workspace = true
thiserror.workspace = true

# ADR-0016: the WASAPI backend (RAW shared mode, exclusive mode).
[target.'cfg(windows)'.dependencies]
audio_thread_priority.workspace = true
wasapi.workspace = true
windows.workspace = true

[target.'cfg(windows)'.dev-dependencies]
wasapi.workspace = true

[lints]
workspace = true
