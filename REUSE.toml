# Licensing annotations for files that do not carry SPDX headers (REUSE specification 3.x).
# Policy: docs/decisions/0010-licensing.md and docs/engineering/supply-chain-and-licensing.md.
# Source files (.rs, .ts, .tsx, .js) carry their own SPDX headers; a header always wins over
# these annotations ("closest" precedence). Add annotations here when tests/golden/,
# assets/ or examples/ data first appear.
version = 1

# Documentation, research notes, bibliography and citation metadata: CC BY 4.0.
[[annotations]]
path = ["**.md", "docs/**", "CITATION.cff"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated JSON Schemas (`cargo xtask codegen`): generated from the code, same licence.
[[annotations]]
path = ["schemas/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test snapshots (insta) and proptest regression seeds: same licence as the code.
[[annotations]]
path = ["**.snap", "**/proptest-regressions/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Build, CI, editor and package configuration, and lockfiles: same licence as the code.
[[annotations]]
path = [
    "**.toml",
    "**.json",
    "**.jsonc",
    "**.yml",
    "**.yaml",
    "Cargo.lock",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    ".github/CODEOWNERS",
    "bindings/python/python/sonarithm/py.typed",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# cargo-fuzz harnesses (`fuzz/` in library crates, testing-strategy §7): lockfile and ignore
# list; seed corpora are JSON and covered above.
[[annotations]]
path = ["crates/*/fuzz/Cargo.lock", "crates/*/fuzz/.gitignore"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test and fuzz corpora of the data layer (synthetic files, no personal data): same
# licence as the code, like snapshots. CSV, spreadsheet and binary files cannot carry
# SPDX headers.
[[annotations]]
path = [
    "crates/sonarithm-data/tests/corpus/**",
    "crates/sonarithm-data/fuzz/corpus/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test fixtures and golden data (synthetic, no personal data): same licence as the code.
# CSV files cannot carry SPDX headers.
[[annotations]]
path = ["**/tests/fixtures/**", "tests/golden/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# A02 spikes (spikes/, throwaway; roadmap A02). Source files carry SPDX headers. These cover
# lockfiles and binary assets (code licence) and measurement results (data licence, ADR-0010).
[[annotations]]
path = ["spikes/**/Cargo.lock", "spikes/**/icons/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "spikes/**/results/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The examples gallery (examples/): datasets, specs and the notebook are CC BY 4.0, like the
# documentation (ADR-0010). Last, so it wins over the JSON annotation above.
[[annotations]]
path = ["examples/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"
