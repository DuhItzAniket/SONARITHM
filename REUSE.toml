# Licensing annotations for files that do not carry SPDX headers (REUSE specification 3.x).
# Policy: docs/decisions/0010-licensing.md and docs/engineering/supply-chain-and-licensing.md.
# Source files (.rs, .ts, .tsx, .js) carry their own SPDX headers; a header always wins over
# these annotations ("closest" precedence). Add annotations here when tests/golden/,
# assets/ or examples/ data first appear.
version = 1

# Documentation, research notes, bibliography and citation metadata: CC BY 4.0.
[[annotations]]
path = ["**.md", "docs/**", "CITATION.cff"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated JSON Schemas (`cargo xtask codegen`): generated from the code, same licence.
[[annotations]]
path = ["schemas/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test snapshots (insta) and proptest regression seeds: same licence as the code.
[[annotations]]
path = ["**.snap", "**/proptest-regressions/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Build, CI, editor and package configuration, and lockfiles: same licence as the code.
[[annotations]]
path = [
    "**.toml",
    "**.json",
    "**.jsonc",
    "**.yml",
    "**.yaml",
    "Cargo.lock",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    ".github/CODEOWNERS",
    "bindings/python/python/sonarithm/py.typed",
    "about.hbs",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# cargo-fuzz harnesses (`fuzz/` in library crates, testing-strategy §7): lockfile and ignore
# list; seed corpora are JSON and covered above.
[[annotations]]
path = [
    "crates/*/fuzz/Cargo.lock",
    "crates/*/fuzz/.gitignore",
    "crates/engines/*/fuzz/Cargo.lock",
    "crates/engines/*/fuzz/.gitignore",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test and fuzz corpora of the data layer, the project reader and PLOTSONA (synthetic files, no
# personal data): same licence as the code, like snapshots. CSV, spreadsheet, binary and
# bundle files cannot carry SPDX headers.
[[annotations]]
path = [
    "crates/sonarithm-data/tests/corpus/**",
    "crates/sonarithm-data/fuzz/corpus/**",
    "crates/sonarithm-app/fuzz/corpus/**",
    "crates/engines/sonarithm-plotsona/fuzz/corpus/**",
    "crates/engines/sonarithm-plotsona/tests/corpus/**",
    # Vega-Lite and MAIDR importer examples, written by the project (C01-T10).
    "crates/engines/sonarithm-plotsona/tests/import/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Test fixtures and golden data (synthetic, no personal data): same licence as the code.
# CSV files cannot carry SPDX headers.
[[annotations]]
path = ["**/tests/fixtures/**", "tests/golden/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Built-in profile presets (B03-T08, ADR-0020): JSON documents, which cannot carry SPDX
# headers; same licence as the code.
[[annotations]]
path = ["crates/sonarithm-app/presets/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The desktop app's icons (B01-T03): rendered from icons/icon.svg by `pnpm tauri icon`;
# binary images cannot carry SPDX headers.
[[annotations]]
path = ["apps/desktop/src-tauri/icons/*.png", "apps/desktop/src-tauri/icons/*.icns", "apps/desktop/src-tauri/icons/*.ico"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Screenshot baselines of the browser tests (B02-T03), taken in CI's pinned Chromium image.
[[annotations]]
path = ["packages/ui/test/visual/__screenshots__/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# A02 spikes (spikes/, throwaway; roadmap A02). Source files carry SPDX headers. These cover
# lockfiles and binary assets (code licence) and measurement results (data licence, ADR-0010).
[[annotations]]
path = ["spikes/**/Cargo.lock", "spikes/**/icons/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = "spikes/**/results/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The examples gallery (examples/): datasets, specs and the notebook are CC BY 4.0, like the
# documentation (ADR-0010). Last, so it wins over the JSON annotation above.
[[annotations]]
path = ["examples/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Replication gallery (A08-T02): specs, generated stimuli and render records are data and
# stimuli, CC BY 4.0 (ADR-0010). Listed last so it wins over the JSON rule above.
[[annotations]]
path = ["replication/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 SONARITHM contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# IBM Plex Sans and Mono (B02-T02): IBM's unmodified WOFF2 files and IBM's licence file, the
# only OFL-1.1 files in the repository. The supply-chain policy allows OFL-1.1 for fonts only
# (docs/engineering/supply-chain-and-licensing.md, "Assets"). Provenance and hashes:
# packages/ui/fonts/README.md and packages/ui/tokens/fonts.ts.
[[annotations]]
path = ["packages/ui/fonts/*.woff2", "packages/ui/fonts/LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"
